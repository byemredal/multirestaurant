# ============================================================================
# Lieferzonen — DEVELOPMENT overlay
# ============================================================================
# Layered on top of docker-compose.yml. Adds dev commands (hot-reload dev
# servers), local dev secrets, file-watch polling and the Postgres/Redis host
# ports. Run with:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# (or `pnpm run docker:up` from the repo root).
# ============================================================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
    # Host port shifted to 5433 — avoids clashing with a local Postgres.
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    # Host port shifted to 6380 — avoids clashing with a local Redis.
    # In-container port stays 6379; services reach it as `redis:6379`.
    ports:
      - "6380:6379"
    restart: unless-stopped

  installer:
    # --no-frozen-lockfile: lockfile is updated in place instead of failing
    # when package.json and pnpm-lock.yaml drift. build:config compiles
    # @lieferzonen/config so the API can import it at start-up.
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm run build:config"

  migrator:
    command: sh -c "corepack enable && pnpm run db:init"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/lieferzonen"

  api:
    command: sh -c "corepack enable && pnpm run start:dev"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/lieferzonen"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "lieferzonen-local-dev-secret"
      CI: "true"
      # Stripe — passed through from the host environment / infra/docker/.env
      # so payment keys are never hard-coded into the compose file.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WEB_APP_BASE_URL: ${WEB_APP_BASE_URL:-http://localhost:3000}

  web:
    command: sh -c "corepack enable && pnpm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      CI: "true"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  admin:
    command: sh -c "corepack enable && pnpm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      CI: "true"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  tenant:
    command: sh -c "corepack enable && pnpm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      CI: "true"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  setup:
    command: sh -c "corepack enable && pnpm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      CI: "true"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
